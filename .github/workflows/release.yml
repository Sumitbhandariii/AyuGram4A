name: Build AyuGram Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "10G"
      CCACHE_HARDLINK: "true"

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Create Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEY_STORE }}
        run: |
          mkdir -p TMessagesProj/config
          echo "$KEYSTORE_BASE64" | base64 --decode > TMessagesProj/config/extera.jks

      - name: Create API_KEYS
        env:
          MY_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          MY_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          cat <<EOF > ./API_KEYS
          APP_ID=${MY_API_ID}
          APP_HASH="${MY_API_HASH}"
          MAPS_V2_API=
          SIGNING_KEY_PASSWORD=${{ secrets.KEY_PASS }}
          SIGNING_KEY_ALIAS=${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_STORE_PASSWORD=${{ secrets.KEY_PASS }}
          EOF

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bison gcc make curl ninja-build ccache

      - name: Grant Gradle Permission
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleAfatRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-Release
          path: "**/build/outputs/apk/**/*.apk"
          
